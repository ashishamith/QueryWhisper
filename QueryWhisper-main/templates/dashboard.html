<!DOCTYPE html>
<html>
<head>
  <title>QueryWhisper AI</title>
</head>

<body style="font-family:Arial; padding:30px;">

  <h1>QueryWhisper AI 🔥</h1>
  <p>Ask questions directly on the demo database.</p>

  <h2>Ask a Question</h2>

  <form id="askForm">
    <textarea name="question" id="question"
      rows="4" cols="60"
      placeholder="Ask something like: show all employees"></textarea>
    <br><br>
    <button type="submit">Ask</button>
  </form>

  <h3>Answer:</h3>
  <pre id="answerBox"></pre>

  <script>
    document.getElementById("askForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      let question = document.getElementById("question").value;

      let res = await fetch("/ask", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: "question=" + encodeURIComponent(question)
      });

      let data = await res.json();

      document.getElementById("answerBox").textContent =
        JSON.stringify(data.results, null, 2);
    });
  </script>

</body>
</html>
